name: fle release (terminal program)

# Builds `fle` for macOS (arm64, x64), Linux (x64) and Windows (x64) and attaches the files to a release.
# Tag pattern cli-vX.Y.Z, so it never collides with the engine's v1.x releases:
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
on:
  push: { tags: ["cli-v*"] }

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-13,       target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release -p fle --target ${{ matrix.target }}
        working-directory: rust
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd rust/target/${{ matrix.target }}/release && tar -czf "$GITHUB_WORKSPACE/fle-cli-${{ matrix.target }}.tar.gz" fle && cd "$GITHUB_WORKSPACE"
          (shasum -a 256 fle-cli-${{ matrix.target }}.tar.gz 2>/dev/null || sha256sum fle-cli-${{ matrix.target }}.tar.gz) | awk '{print $1"  fle-cli-${{ matrix.target }}.tar.gz"}' > fle-cli-${{ matrix.target }}.tar.gz.sha256
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive rust/target/${{ matrix.target }}/release/fle.exe fle-cli-${{ matrix.target }}.zip
          $h = (Get-FileHash fle-cli-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$h  fle-cli-${{ matrix.target }}.zip" | Out-File -Encoding ascii fle-cli-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with: { name: "fle-cli-${{ matrix.target }}", path: "fle-cli-${{ matrix.target }}.*" }
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cp rust/install.sh rust/install.ps1 dist/
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*", prerelease: true, name: "fle terminal program ${{ github.ref_name }}" }
