<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="fle-token" content="__FLE_TOKEN__">
<meta name="color-scheme" content="dark light">
<title>FLE Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/dm-sans-latin-1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#e879f9"/>
          </linearGradient>
        </defs>
        <g fill="currentColor" opacity="0.22">
          <rect x="13" y="4.5" width="6" height="6" rx="1.7"/><rect x="21.5" y="4.5" width="6" height="6" rx="1.7"/>
          <rect x="4.5" y="13" width="6" height="6" rx="1.7"/><rect x="13" y="13" width="6" height="6" rx="1.7"/>
          <rect x="4.5" y="21.5" width="6" height="6" rx="1.7"/><rect x="21.5" y="21.5" width="6" height="6" rx="1.7"/>
        </g>
        <g fill="url(#brand-g)">
          <rect x="4.5" y="4.5" width="6" height="6" rx="1.7"/><rect x="21.5" y="13" width="6" height="6" rx="1.7"/>
          <rect x="13" y="21.5" width="6" height="6" rx="1.7"/>
        </g>
      </svg>
      <span class="brand-name"><b>FLE</b> Studio</span>
      <span class="brand-ver" id="brand-ver"></span>
    </div>
    <a class="btn btn-new" href="/" data-link id="new-chat"></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-section"><span>Chats</span></div>
    <input class="chat-search" id="chat-search" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off">
    <div class="chat-list" id="chat-list"></div>
    <div class="engine-card" id="engine-card" role="button" tabindex="0"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">FLE Studio needs JavaScript.</p></noscript>
</body>
</html>
